{% extends "base.html" %}
{% block title %}Check In Booking #{{ booking.id }}{% endblock %}
{% block content %}
<h2>Check In</h2>
<p>Are you sure you want to check in booking #{{ booking.id }} for {{ booking.guest.first_name }} {{ booking.guest.last_name }}?</p>
<form method="POST">
    {{ form.hidden_tag() }}
    <button type="submit" class="btn btn-success">Confirm Check In</button>
    <a href="{{ url_for('booking_detail', id=booking.id) }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
